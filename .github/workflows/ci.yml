name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:toolchain
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify generated API types
        run: |
          pnpm api:generate
          git diff --exit-code -- api/ web/packages/api/src/types.ts web/packages/api/src/ws-types.ts
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: server/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l server screen)"
      - working-directory: server
        run: go vet ./...
      - working-directory: server
        run: go test -race ./...
  windows-screen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: screen/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @classding/screen build
      - working-directory: screen
        run: go vet ./...
      - working-directory: screen
        run: go test -v ./...
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
