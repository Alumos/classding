name: Build Windows screen client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: screen/go.sum

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify screen frontend
        run: |
          pnpm check:toolchain
          pnpm --filter @classding/screen typecheck
          pnpm exec vitest run screen/frontend/tests
          pnpm --filter @classding/screen build

      - name: Verify native desktop windows and server migration
        working-directory: screen
        run: go test ./...

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build per-user installer
        shell: pwsh
        working-directory: screen
        run: |
          $source = [System.IO.File]::ReadAllBytes('build\windows\installer\project.nsi')
          if ($source.Length -lt 3 -or $source[0] -ne 0xEF -or $source[1] -ne 0xBB -or $source[2] -ne 0xBF) {
            throw 'NSIS project.nsi must be saved as UTF-8 with BOM.'
          }
          $scriptText = [System.Text.UTF8Encoding]::new($false, $true).GetString($source, 3, $source.Length - 3)
          if ($scriptText -notmatch '(?m)^Unicode true\s*$' -or $scriptText -notmatch '(?m)^!include /CHARSET=UTF8 "wails_tools\.nsh"\s*$') {
            throw 'NSIS must use Unicode and read the generated Wails tools as UTF-8.'
          }
          $wails = Join-Path (go env GOPATH) 'bin\wails.exe'
          & $wails build -platform windows/amd64 -nsis -installscope user
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = 'build\bin\ClassDingScreen-amd64-installer.exe'
          if (-not (Test-Path $installer)) { throw "Wails did not generate $installer" }
          $expectedName = (Get-Content 'wails.json' -Raw -Encoding utf8 | ConvertFrom-Json).info.productName
          $actualName = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $installer).Path).ProductName
          if ($actualName -cne $expectedName) { throw "Installer product name was not encoded correctly: $actualName" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ClassDingScreen-amd64-installer.exe" | Set-Content 'build\bin\ClassDingScreen-amd64-installer.exe.sha256' -Encoding Ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ClassDingScreen-windows-amd64
          path: |
            screen/build/bin/ClassDingScreen-amd64-installer.exe
            screen/build/bin/ClassDingScreen-amd64-installer.exe.sha256
          if-no-files-found: error

      - name: Publish installer on tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
            if (Test-Path $notes) {
              gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "课堂叮咚 $env:GITHUB_REF_NAME" --notes-file $notes --draft
            } else {
              gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --generate-notes --draft
            }
            if ($LASTEXITCODE -ne 0) {
              gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
              if ($LASTEXITCODE -ne 0) { throw 'Could not create or find release' }
            }
          }
          gh release upload "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber `
            'screen/build/bin/ClassDingScreen-amd64-installer.exe' `
            'screen/build/bin/ClassDingScreen-amd64-installer.exe.sha256'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
